global:
  domain: argocd.test.com

redis-ha:
  enabled: false

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

certificate:
  enabled: true

server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    hosts:
      - argocd.test.com
    tls:
      - secretName: argocd-server-tls
        hosts:
          - argocd.test.com
